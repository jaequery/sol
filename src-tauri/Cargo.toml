[package]
name = "solcut"
description = "SolCut — a simplified CapCut-style editor with one timeline and AI photo-to-photo transitions."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "solcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
solcut-agent = { path = "crates/agent" }
solcut-higgsfield = { path = "crates/higgsfield" }
solcut-render = { path = "crates/render" }
