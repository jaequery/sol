[workspace]
resolver = "2"
members = [
    "src-tauri",
    "src-tauri/crates/agent",
    "src-tauri/crates/higgsfield",
    "src-tauri/crates/intake",
    "src-tauri/crates/render",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
