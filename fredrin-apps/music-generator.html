<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songsmith</title>
<meta name="description" content="Describe a song in words and hear it composed and synthesized in the browser.">
<meta name="fredrin:icon" content="wand">
<style>
  :root {
    --ms-bg: var(--background, light-dark(#ffffff, #17181c));
    --ms-fg: var(--foreground, light-dark(#17181c, #f2f3f5));
    --ms-card: var(--card, light-dark(#fbfbfc, #1e1f25));
    --ms-muted: var(--muted-foreground, light-dark(#6b7280, #9aa0ac));
    --ms-line: var(--border, light-dark(#e6e7ea, #2c2e36));
    --ms-input: var(--input, light-dark(#ffffff, #1a1b21));
    --ms-accent: var(--primary, light-dark(#5b46e5, #8b7bff));
    --ms-on-accent: var(--primary-foreground, light-dark(#ffffff, #0f1014));
    --ms-danger: var(--destructive, light-dark(#c0392b, #f2777a));
    --ms-r: 8px;
    /* light-dark() in the fallbacks is inert without this; the saved-to-disk
       copy of this page has no injected theme, and would otherwise always render light */
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ms-bg);
    color: var(--ms-fg);
    font: 400 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 40px 24px 72px; }

  .top { font-size: 12px; color: var(--ms-muted); margin-bottom: 36px; display: flex; gap: 8px; align-items: baseline; }
  .top b { font-weight: 600; color: var(--ms-fg); }
  .top .sep { opacity: .5; }

  label.lede { display: block; font-size: 12px; color: var(--ms-muted); margin-bottom: 10px; }
  textarea#prompt {
    width: 100%; min-height: 92px; resize: vertical;
    background: var(--ms-input); color: var(--ms-fg);
    border: 1px solid var(--ms-line); border-radius: var(--ms-r);
    padding: 12px 14px; font: inherit; outline: none;
  }
  textarea#prompt::placeholder { color: var(--ms-muted); }
  textarea#prompt:focus { border-color: var(--ms-accent); }

  .row { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
  .grow { flex: 1; }
  button {
    font: inherit; cursor: pointer; border-radius: var(--ms-r);
    padding: 9px 18px; border: 1px solid var(--ms-line);
    background: transparent; color: var(--ms-fg);
  }
  button:hover:not(:disabled) { border-color: var(--ms-accent); }
  button:focus-visible { outline: 2px solid var(--ms-accent); outline-offset: 2px; }
  button:disabled { opacity: .42; cursor: default; }
  button.primary { background: var(--ms-accent); color: var(--ms-on-accent); border-color: transparent; font-weight: 600; }
  button.icon { padding: 9px 14px; font-variant-numeric: tabular-nums; }

  .hint { font-size: 12px; color: var(--ms-muted); }

  #stage { margin-top: 40px; }
  .song-title { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .song-sub { font-size: 12px; color: var(--ms-muted); margin-bottom: 24px; font-variant-numeric: tabular-nums; }

  .transport { display: flex; align-items: center; gap: 14px; }
  .track { position: relative; height: 2px; background: var(--ms-line); border-radius: 2px; cursor: pointer; }
  .track > .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ms-accent); border-radius: 2px; }
  .time { font-size: 12px; color: var(--ms-muted); font-variant-numeric: tabular-nums; min-width: 76px; text-align: right; }

  .marks { display: flex; gap: 3px; margin-top: 14px; }
  .marks > span { height: 3px; border-radius: 2px; background: var(--ms-line); }
  .marks > span.on { background: var(--ms-accent); }

  details { margin-top: 32px; border-top: 1px solid var(--ms-line); padding-top: 14px; }
  summary { font-size: 12px; color: var(--ms-muted); cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--ms-fg); }
  summary:focus-visible { outline: 2px solid var(--ms-accent); outline-offset: 2px; }
  .panel { padding-top: 16px; }

  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; margin: 0; font-size: 12px; }
  dt { color: var(--ms-muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }

  table.lanes { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  table.lanes th { width: 68px; text-align: left; font-weight: 400; color: var(--ms-muted); padding: 3px 10px 3px 0; white-space: nowrap; }
  table.lanes td { padding: 3px 0; }
  .cells { display: flex; gap: 2px; }
  .cells > i { display: block; height: 8px; flex: 1; border-radius: 1px; background: var(--ms-line); }
  .cells > i.on { background: var(--ms-accent); }
  .cells > i.dim { background: var(--ms-accent); opacity: .38; }

  .note { font-size: 12px; color: var(--ms-muted); margin-top: 12px; }
  .err { font-size: 12px; color: var(--ms-danger); margin-top: 12px; }
  audio { width: 100%; margin-top: 14px; }

  .skeleton { height: 12px; width: 180px; border-radius: 3px; background: var(--ms-line); opacity: .6; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <b>Songsmith</b><span class="sep">·</span><span id="project"><span class="skeleton"></span></span>
  </div>

  <label class="lede" for="prompt">Describe the song</label>
  <textarea id="prompt" rows="3" spellcheck="false"
    placeholder="dreamy lo-fi at 78 bpm, rainy and nostalgic"></textarea>
  <div class="row">
    <button id="go" class="primary">Generate</button>
    <span class="grow"></span>
    <span class="hint" id="hint" role="status" aria-live="polite">Same words always make the same song.</span>
  </div>

  <div id="stage" hidden></div>
</div>

<script>
(() => {
  const METHODS = ["project.get", "tickets.list", "tickets.get", "notes.list", "notes.get", "connectors.list", "connectors.metrics", "ui.toast"];
  const pending = new Map();
  const queued = [];
  let port = null;
  let seq = 0;

  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "fredrin:port") return;
    if (port || !event.ports || !event.ports[0]) return;
    port = event.ports[0];
    port.onmessage = (message) => {
      const reply = message.data;
      if (!reply || typeof reply.id !== "string") return;
      const entry = pending.get(reply.id);
      if (!entry) return;
      pending.delete(reply.id);
      if (reply.ok) entry.resolve(reply.data);
      else entry.reject(new Error(reply.error + ": " + reply.message));
    };
    while (queued.length) queued.shift()();
  });

  const call = (method, params) =>
    new Promise((resolve, reject) => {
      const id = "c" + ++seq;
      const send = () => {
        pending.set(id, { resolve, reject });
        port.postMessage({ fredrin: 1, id, method, params });
      };
      port ? send() : queued.push(send);
    });

  const api = {};
  for (const name of METHODS) {
    const [ns, fn] = name.split(".");
    (api[ns] = api[ns] || {})[fn] = (params) => call(name, params);
  }
  window.fredrin = api;
})();
</script>

<script id="engine">
/* ENGINE-START — pure, no DOM, no Web Audio. Extracted verbatim by the test harness. */
var ENGINE = (function () {
  "use strict";

  /* ---------- seeded randomness (cyrb128 + sfc32) ---------- */
  function cyrb128(str) {
    var h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
    for (var i = 0, k; i < str.length; i++) {
      k = str.charCodeAt(i);
      h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
      h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
      h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
      h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
  }
  function sfc32(a, b, c, d) {
    return function () {
      a |= 0; b |= 0; c |= 0; d |= 0;
      var t = (((a + b) | 0) + d) | 0;
      d = (d + 1) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0;
      c = (c << 21) | (c >>> 11); c = (c + t) | 0;
      return (t >>> 0) / 4294967296;
    };
  }
  function makeRng(seedString) {
    var s = cyrb128(seedString);
    var r = sfc32(s[0], s[1], s[2], s[3]);
    for (var i = 0; i < 16; i++) r();
    r.pick = function (arr) { return arr[Math.floor(r() * arr.length) % arr.length]; };
    r.range = function (lo, hi) { return lo + r() * (hi - lo); };
    r.int = function (lo, hi) { return Math.floor(lo + r() * (hi - lo + 1)); };
    r.chance = function (p) { return r() < p; };
    return r;
  }

  /* ---------- theory ---------- */
  var MODES = {
    major:      [0, 2, 4, 5, 7, 9, 11],
    minor:      [0, 2, 3, 5, 7, 8, 10],
    dorian:     [0, 2, 3, 5, 7, 9, 10],
    phrygian:   [0, 1, 3, 5, 7, 8, 10],
    lydian:     [0, 2, 4, 6, 7, 9, 11],
    mixolydian: [0, 2, 4, 5, 7, 9, 10]
  };
  var NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  var MINORISH = { minor: 1, dorian: 1, phrygian: 1 };

  function stack(modeName, degree, count) {
    var sc = MODES[modeName], out = [];
    for (var i = 0; i < count; i++) {
      var idx = degree + i * 2;
      out.push(sc[idx % 7] + 12 * Math.floor(idx / 7));
    }
    return out;
  }

  /* ---------- genres ---------- */
  var GENRES = {
    lofi: {
      label: "lo-fi", bpm: [68, 88], swing: 0.60, chordTones: 5, barsPerChord: 1,
      modes: ["minor", "dorian"], reverb: 0.26, delay: 0.18,
      progressions: [[0, 5, 2, 6], [0, 3, 5, 4], [1, 4, 0, 0], [0, 6, 5, 6]],
      majorProgressions: [[0, 5, 3, 4], [3, 4, 2, 5], [0, 4, 5, 3]]
    },
    house: {
      label: "house", bpm: [118, 128], swing: 0.54, chordTones: 4, barsPerChord: 1,
      modes: ["minor", "dorian"], reverb: 0.2, delay: 0.22,
      progressions: [[0, 3, 5, 6], [5, 6, 0, 0], [0, 6, 5, 6], [3, 6, 2, 5]],
      majorProgressions: [[0, 4, 5, 3], [5, 3, 0, 4]]
    },
    synthwave: {
      label: "synthwave", bpm: [92, 116], swing: 0.5, chordTones: 3, barsPerChord: 1,
      modes: ["minor", "dorian"], reverb: 0.3, delay: 0.3,
      progressions: [[0, 6, 3], [0, 4, 5, 6], [0, 6, 5, 6], [0, 5, 2, 6]],
      majorProgressions: [[0, 4, 5, 3], [5, 3, 0, 4]]
    },
    ambient: {
      label: "ambient", bpm: [58, 78], swing: 0.5, chordTones: 5, barsPerChord: 2,
      modes: ["lydian", "dorian", "mixolydian"], reverb: 0.55, delay: 0.3,
      progressions: [[0, 3], [0, 6], [0, 5, 3, 6]],
      majorProgressions: [[0, 1], [0, 3], [0, 6]]
    },
    trap: {
      label: "trap", bpm: [130, 152], swing: 0.5, chordTones: 3, barsPerChord: 1,
      modes: ["minor", "phrygian"], reverb: 0.18, delay: 0.12,
      progressions: [[0, 5, 6], [0, 6, 5, 6], [0, 0, 5, 5], [0, 1, 5, 6]],
      majorProgressions: [[0, 5, 3, 4]]
    }
  };

  var GENRE_WORDS = {
    lofi: ["lofi", "lo-fi", "lofihiphop", "chillhop", "chill", "study", "jazzy", "jazz", "rainy", "rain", "nostalgic", "vinyl", "boombap", "mellow", "cozy", "dusty", "tape", "rhodes", "coffee"],
    house: ["house", "deep", "techno", "dance", "club", "disco", "garage", "edm", "festival", "rave", "groove", "funky", "four", "banger", "drop"],
    synthwave: ["synthwave", "retro", "80s", "eighties", "outrun", "neon", "vaporwave", "arcade", "cyber", "cyberpunk", "vhs", "miami", "chrome", "darkwave"],
    ambient: ["ambient", "drone", "cinematic", "film", "score", "soundtrack", "epic", "peaceful", "meditation", "space", "ethereal", "floating", "sleep", "orchestral", "strings", "choir", "vast", "glacial"],
    trap: ["trap", "hiphop", "rap", "808", "drill", "beat", "bounce", "menacing", "grime", "hardhitting", "phonk"]
  };

  var VALENCE = {
    happy: 0.8, uplifting: 0.7, bright: 0.6, joyful: 0.8, sunny: 0.6, hopeful: 0.5,
    warm: 0.4, sweet: 0.4, triumphant: 0.7, playful: 0.5, summer: 0.5, love: 0.5,
    sad: -0.8, melancholic: -0.6, melancholy: -0.6, dark: -0.7, moody: -0.5, somber: -0.6,
    lonely: -0.6, haunting: -0.6, tense: -0.5, angry: -0.6, menacing: -0.7, grim: -0.7,
    nostalgic: -0.2, wistful: -0.3, bittersweet: -0.2, rainy: -0.3, cold: -0.4, dreamy: 0.15
  };
  var ENERGY = {
    energetic: 0.9, driving: 0.8, fast: 0.8, hard: 0.9, banging: 0.9, intense: 0.85,
    epic: 0.7, punchy: 0.7, upbeat: 0.7, aggressive: 0.85, heavy: 0.7, frantic: 0.9,
    calm: -0.7, slow: -0.7, gentle: -0.6, soft: -0.6, sleepy: -0.8, mellow: -0.5,
    relaxed: -0.6, quiet: -0.7, sparse: -0.5, chill: -0.45, floaty: -0.5, ambient: -0.6,
    minimal: -0.4, peaceful: -0.7
  };
  var INSTRUMENT_WORDS = {
    piano: "keys", rhodes: "keys", keys: "keys", organ: "keys",
    guitar: "pluck", pluck: "pluck", arp: "pluck", arpeggio: "pluck", bells: "pluck", harp: "pluck",
    strings: "pad", choir: "pad", pad: "pad", synth: "pad", warm: "pad",
    bass: "bass", "808": "bass", sub: "bass",
    drums: "drums", beat: "drums", percussion: "drums"
  };
  var STOP = {};
  ("a an the and or but with of in on at to for from into is are be am was were song track music "
   + "make making generate generated create sounding sound like feel feeling that this it its "
   + "very really some more most please just about kind sort something anything my your our their "
   + "give want need write compose "
   /* technical tokens describe the request, not the song — they read badly in a title */
   + "bpm beat beats tempo key minor major maj min dorian phrygian lydian mixolydian "
   + "instrumental drumless beatless no").split(" ").forEach(function (w) { STOP[w] = 1; });

  var FALLBACK_TITLES = ["Drift", "Halogen", "Undertow", "Paper Moon", "Slow Static", "Nightfall",
    "Blue Hour", "Afterimage", "Low Tide", "Signal Lost", "Glass House", "Long Way Down"];

  function normalize(text) {
    return String(text == null ? "" : text).toLowerCase().replace(/[^a-z0-9#+\- ]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function parsePrompt(text) {
    var raw = String(text == null ? "" : text);
    var norm = normalize(raw);
    var words = norm ? norm.split(" ") : [];
    var rng = makeRng("songsmith/v1/" + norm);

    /* genre by keyword score, ties broken by seed */
    var best = null;
    for (var g in GENRE_WORDS) {
      var score = 0;
      for (var i = 0; i < words.length; i++) {
        if (GENRE_WORDS[g].indexOf(words[i]) >= 0) score += 2;
        if (GENRE_WORDS[g].indexOf(words[i].replace(/-/g, "")) >= 0) score += 1;
      }
      if (!best || score > best.score) best = { g: g, score: score };
    }
    var genre = best && best.score > 0 ? best.g : rng.pick(["lofi", "house", "synthwave", "ambient", "trap"]);
    var G = GENRES[genre];

    /* mood */
    var valence = 0, energy = 0, moodHits = 0;
    for (var j = 0; j < words.length; j++) {
      if (VALENCE[words[j]] !== undefined) { valence += VALENCE[words[j]]; moodHits++; }
      if (ENERGY[words[j]] !== undefined) { energy += ENERGY[words[j]]; moodHits++; }
    }
    if (moodHits > 1) { valence /= Math.sqrt(moodHits); energy /= Math.sqrt(moodHits); }
    valence = Math.max(-1, Math.min(1, valence));
    energy = Math.max(-1, Math.min(1, energy + rng.range(-0.12, 0.12)));

    /* tempo */
    var bpm = null;
    var mBpm = norm.match(/(\d{2,3})\s*(?:bpm|beats)/);
    if (mBpm) bpm = Math.max(50, Math.min(200, parseInt(mBpm[1], 10)));
    if (bpm === null) {
      var lo = G.bpm[0], hi = G.bpm[1];
      bpm = Math.round(lo + (hi - lo) * (0.5 + energy * 0.5));
      bpm = Math.max(lo, Math.min(hi, bpm));
    }

    /* key + mode */
    var modeName = null;
    var mMode = norm.match(/\b(major|minor|dorian|phrygian|lydian|mixolydian|maj|min)\b/);
    if (mMode) {
      var mm = mMode[1];
      modeName = mm === "maj" ? "major" : mm === "min" ? "minor" : mm;
    }
    var root = null;
    var mKey = norm.match(/\b(?:in\s+)?([a-g])\s*(#|b|sharp|flat)?\s*(?:major|minor|dorian|phrygian|lydian|mixolydian|maj|min)\b/);
    if (!mKey) mKey = norm.match(/\bin\s+([a-g])\s*(#|b|sharp|flat)?\b/);
    if (mKey) {
      var base = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[mKey[1]];
      var acc = mKey[2];
      if (acc === "#" || acc === "sharp") base += 1;
      else if (acc === "b" || acc === "flat") base -= 1;
      root = ((base % 12) + 12) % 12;
    }
    if (modeName === null) {
      modeName = valence > 0.25 ? "major" : rng.pick(G.modes);
      if (valence > 0.25 && G.majorProgressions.length === 0) modeName = rng.pick(G.modes);
    }
    if (!MODES[modeName]) modeName = "minor";
    if (root === null) root = rng.int(0, 11);

    /* instruments named explicitly */
    var instruments = {};
    for (var k = 0; k < words.length; k++) {
      var role = INSTRUMENT_WORDS[words[k]];
      if (role) instruments[role] = 1;
    }
    var noDrums = /\bno\s+(?:drums|beat|percussion)\b/.test(norm) || /\b(?:instrumental|drumless|beatless)\b/.test(norm);
    if (genre === "ambient" && !instruments.drums) noDrums = noDrums || !/\bbeat|drums|percussion\b/.test(norm);

    /* length */
    var lengthHint = /\b(short|brief|quick|tiny)\b/.test(norm) ? "short"
      : /\b(long|extended|full)\b/.test(norm) ? "long" : "normal";

    /* title from the most distinctive words */
    var picked = [];
    for (var w = 0; w < words.length && picked.length < 3; w++) {
      var t = words[w];
      if (STOP[t] || t.length < 3 || /^\d+$/.test(t)) continue;
      if (picked.indexOf(t) >= 0) continue;
      picked.push(t);
    }
    var title = picked.length
      ? picked.map(function (s) { return s.charAt(0).toUpperCase() + s.slice(1); }).join(" ")
      : rng.pick(FALLBACK_TITLES);
    if (title.length > 42) title = title.slice(0, 42).trim();

    return {
      prompt: raw, seed: "songsmith/v1/" + norm, genre: genre, genreLabel: G.label,
      bpm: bpm, root: root, rootName: NOTE_NAMES[root], mode: modeName,
      valence: Math.round(valence * 100) / 100, energy: Math.round(energy * 100) / 100,
      instruments: instruments, noDrums: noDrums, lengthHint: lengthHint, title: title
    };
  }

  /* ---------- arrangement ---------- */
  var LAYERS = {
    intro:  { pad: 0.75, keys: 0.6, bass: 0.0, sub: 0, kick: 0, snare: 0, hat: 0.45, pluck: 0.5, lead: 0 },
    verse:  { pad: 0.7,  keys: 0.8, bass: 1.0, sub: 0.7, kick: 1, snare: 1, hat: 1.0, pluck: 0.7, lead: 0 },
    build:  { pad: 0.8,  keys: 0.7, bass: 1.0, sub: 0.8, kick: 1, snare: 1, hat: 1.0, pluck: 0.9, lead: 0.5 },
    chorus: { pad: 1.0,  keys: 0.9, bass: 1.0, sub: 1.0, kick: 1, snare: 1, hat: 1.0, pluck: 0.7, lead: 1.0 },
    bridge: { pad: 0.9,  keys: 0.7, bass: 0.6, sub: 0.0, kick: 0, snare: 0, hat: 0.35, pluck: 0.5, lead: 0.7 },
    outro:  { pad: 0.7,  keys: 0.5, bass: 0.4, sub: 0.0, kick: 0, snare: 0, hat: 0.0, pluck: 0.4, lead: 0 }
  };

  function sectionPlan(genre, lengthHint) {
    if (genre === "ambient") {
      if (lengthHint === "short") return [["intro", 8], ["verse", 16], ["outro", 8]];
      return [["intro", 8], ["verse", 16], ["bridge", 8], ["chorus", 16], ["outro", 8]];
    }
    if (lengthHint === "short") return [["intro", 4], ["verse", 8], ["chorus", 8], ["outro", 4]];
    if (lengthHint === "long") {
      return [["intro", 4], ["verse", 8], ["build", 4], ["chorus", 8], ["verse", 8],
              ["build", 4], ["chorus", 8], ["bridge", 8], ["chorus", 8], ["outro", 4]];
    }
    return [["intro", 4], ["verse", 8], ["build", 4], ["chorus", 8], ["verse", 8], ["chorus", 8], ["outro", 4]];
  }

  /* drum grids, 16 steps to the bar */
  var PATTERNS = {
    lofi:      { kick: "x.....x...x.....", snare: "....x.......x...", ghost: "..x...........x.", hat: "x.x.x.x.x.x.x.x.", ohat: "..............x." },

      var s2 = ctx.createBufferSource(); s2.buffer = buffer; s2.connect(dest); s2.start(0); return s2;

      var peak = 0, ch, d, j, a;
      for (ch = 0; ch < buf.numberOfChannels; ch++) {

/* ---------------- interface ---------------- */
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

    return n;

          forever and the header would otherwise sit on a skeleton for good. ---- */

    var target = $("project");
    var timeout = new Promise(function (res) { setTimeout(function () { res(null); }, 2500); });
    var ask;
    try { ask = window.fredrin.project.get(); } catch (e) { ask = Promise.reject(e); }

      target.textContent = p && p.name ? p.name : "standalone";

  }
  function paint() {
    if (refs.play) refs.play.textContent = S.playing ? "Pause" : "Play";
    if (refs.play) refs.play.setAttribute("aria-label", S.playing ? "Pause" : "Play");
    paintProgress();
  }

  /* ---- the song view ---- */
  var VOICE_ROWS = [
    ["Drums", ["kick", "snare", "hat"]], ["Bass", ["bass", "sub"]], ["Pad", ["pad"]],
    ["Keys", ["keys"]], ["Arp", ["pluck"]], ["Lead", ["lead"]]
  ];

  function renderStage() {
    var song = S.song;
    stageEl.textContent = "";
    stageEl.hidden = false;

    stageEl.appendChild(el("h2", "song-title", song.title));
    var G = ENGINE.GENRES[song.genre];
    stageEl.appendChild(el("div", "song-sub",
      G.label + " · " + song.rootName + " " + song.mode + " · " + song.bpm + " bpm · " +
      song.sections.length + " sections · " + clock(S.buffer ? S.buffer.duration : song.seconds)));

    var tr = el("div", "transport");
    refs.play = el("button", "icon", "Play");
    refs.play.addEventListener("click", function () {
      if (S.playing) pause(); else startAt(S.offset);
    });
    var trackWrap = el("div", "grow");
    var track = el("div", "track");
    refs.fill = el("div", "fill");
    track.appendChild(refs.fill);
    track.addEventListener("click", function (ev) {
      var r = track.getBoundingClientRect();
      var frac = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
      var to = frac * S.buffer.duration;
      if (S.playing) startAt(to); else { S.offset = to; paint(); }
    });
    trackWrap.appendChild(track);
    var marksWrap = el("div", "marks");
    refs.marks = [];
    for (var i = 0; i < song.sections.length; i++) {
      var mk = el("span");
      mk.style.flex = String(song.sections[i].bars);
      mk.title = song.sections[i].name;
      marksWrap.appendChild(mk);
      refs.marks.push(mk);
    }
    trackWrap.appendChild(marksWrap);
    refs.time = el("div", "time", "0:00 / " + clock(song.seconds));
    tr.appendChild(refs.play); tr.appendChild(trackWrap); tr.appendChild(refs.time);
    stageEl.appendChild(tr);

    /* --- secondary: how it was read, behind a disclosure --- */
    var d1 = el("details");
    d1.appendChild(el("summary", null, "How this was read"));
    var p1 = el("div", "panel");
    var dl = el("dl");
    function pair(k, v) { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); }
    pair("Genre", G.label);
    pair("Key", song.rootName + " " + song.mode);
    pair("Tempo", song.bpm + " bpm" + (song.swing > 0.5 ? " · swung " + Math.round(song.swing * 100) + "%" : ""));
    pair("Mood", "valence " + song.brief.valence.toFixed(2) + " · energy " + song.brief.energy.toFixed(2));
    pair("Form", song.sections.map(function (s) { return s.name; }).join(" → "));
    pair("Chords", song.chordCount + " over " + song.bars + " bars");
    pair("Notes", String(song.events.length));
    p1.appendChild(dl);

    var tbl = el("table", "lanes");
    for (var r = 0; r < VOICE_ROWS.length; r++) {
      var row = el("tr");
      row.appendChild(el("th", null, VOICE_ROWS[r][0]));
      var td = el("td");
      var cells = el("div", "cells");
      for (var sIdx = 0; sIdx < song.sections.length; sIdx++) {
        var lay = ENGINE.LAYERS[song.sections[sIdx].name];
        var amt = 0;
        for (var vI = 0; vI < VOICE_ROWS[r][1].length; vI++) {
          amt = Math.max(amt, lay[VOICE_ROWS[r][1][vI]] || 0);
        }
        var cell = el("i", amt >= 0.8 ? "on" : amt > 0 ? "dim" : "");
        cell.style.flex = String(song.sections[sIdx].bars);
        cell.title = song.sections[sIdx].name;
        cells.appendChild(cell);
      }
      td.appendChild(cells); row.appendChild(td); tbl.appendChild(row);
    }
    p1.appendChild(tbl);
    d1.appendChild(p1);
    stageEl.appendChild(d1);

    /* --- export, behind its own disclosure --- */
    var d2 = el("details");
    d2.appendChild(el("summary", null, "Export"));
    var p2 = el("div", "panel");
    var expBtn = el("button", null, "Render file");
    var expNote = el("div", "note", "Encodes the exact audio you just heard.");
    var expHolder = el("div");
    expBtn.addEventListener("click", function () { doExport(expBtn, expNote, expHolder); });
    p2.appendChild(expBtn); p2.appendChild(expNote); p2.appendChild(expHolder);
    d2.appendChild(p2);
    stageEl.appendChild(d2);

    paint();
  }

  function doExport(btn, note, holder) {
    if (btn.disabled) return;
    btn.disabled = true;
    holder.textContent = "";
    note.textContent = "Encoding…";
    if (S.exportUrl) { URL.revokeObjectURL(S.exportUrl); S.exportUrl = null; }
    EXPORT.encode(S.buffer, function (frac) {
      note.textContent = "Encoding… " + Math.round(frac * 100) + "%";
    }).then(function (res) {
      var name = S.song.title.replace(/[^\w\- ]+/g, "").replace(/\s+/g, "-").toLowerCase() || "song";
      name = name + "." + res.ext;
      S.exportUrl = URL.createObjectURL(res.blob);
      var kb = Math.round(res.blob.size / 1024);
      note.textContent = res.codec + " · " + name + " · " + (kb > 1024 ? (kb / 1024).toFixed(1) + " MB" : kb + " KB");

      var audio = document.createElement("audio");
      audio.controls = true;
      audio.src = S.exportUrl;
      holder.appendChild(audio);

      var row = el("div", "row");
      var save = el("button", null, "Save");
      save.addEventListener("click", function () {
        var a = document.createElement("a");
        a.href = S.exportUrl; a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      });
      row.appendChild(save);
      holder.appendChild(row);

      /* The sandbox blocks content-initiated downloads and gives no signal when it does,
         so this is stated rather than detected. */
      holder.appendChild(el("div", "note",
        "Fredrin runs this app in a sandbox that blocks downloads, silently — Save may do " +
        "nothing here. To keep the file, right-click the player above and choose “Save audio " +
        "as…”, or use Fredrin's own Download button on this app and open the saved page from " +
        "your computer, where Save works. The same words always compose the same song, so the " +
        "file you get either way is identical."));
      btn.disabled = false;
    }).catch(function (e) {
      note.textContent = "";
      holder.appendChild(el("div", "err", "Could not encode: " + (e && e.message ? e.message : "unknown error")));
      btn.disabled = false;
    });
  }

  /* ---- generate ---- */
  function generate() {
    if (S.busy) return;
    var text = promptEl.value;
    if (!text.trim()) {
      text = promptEl.placeholder;
      promptEl.value = text;
    }
    S.busy = true;
    goEl.disabled = true;
    stopNode();
    S.offset = 0;
    var token = ++S.token;
    say("Composing…");

    if (!S.actx) {
      try { S.actx = new AudioContext({ sampleRate: AUDIO.SR }); }
      catch (e) { S.actx = new AudioContext(); }
    }
    if (S.actx.state === "suspended") S.actx.resume();

    /* let the label paint before the graph build takes the main thread */
    setTimeout(function () {
      var song, rng;
      try {
        song = ENGINE.generate(text);
        rng = ENGINE.makeRng(song.brief.seed + "/audio");
      } catch (e) {
        fail(e); return;
      }
      say("Composing… synthesising " + song.events.length + " notes");
      AUDIO.renderBank(song, rng).then(function (kit) {
        if (token !== S.token) return null;
        return AUDIO.renderSong(song, kit, rng);
      }).then(function (buf) {
        if (!buf || token !== S.token) return;
        if (S.url) { URL.revokeObjectURL(S.url); S.url = null; }
        if (S.exportUrl) { URL.revokeObjectURL(S.exportUrl); S.exportUrl = null; }
        S.song = song;
        S.buffer = buf;              /* the previous buffer is dropped here, not retained */
        S.busy = false; goEl.disabled = false;
        goEl.textContent = "Generate";
        say("Same words always make the same song.");
        renderStage();
        startAt(0);
      }).catch(fail);
    }, 16);

    function fail(e) {
      if (token !== S.token) return;
      S.busy = false; goEl.disabled = false;
      say("");
      stageEl.hidden = false;
      stageEl.textContent = "";
      stageEl.appendChild(el("div", "err",
        "Could not compose that: " + (e && e.message ? e.message : "unknown error") +
        ". Try different words."));
    }
  }

  goEl.addEventListener("click", generate);
  promptEl.addEventListener("keydown", function (ev) {
    if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter") { ev.preventDefault(); generate(); }
  });
})();
</script>
</body>
</html>
